controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    motor_position_controller:
      type: position_controllers/JointGroupPositionController

    xy_position_controller:
      type: position_controllers/JointGroupPositionController

motor_position_controller:
  ros__parameters:
    type: position_controllers/JointGroupPositionController
    joints:
      - motorA_joint
      - motorB_joint

xy_position_controller:
  ros__parameters:
    type: position_controllers/JointGroupPositionController
    joints:
      - x_axis_joint
      - y_axis_joint

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster
